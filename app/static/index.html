<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WooCRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f7;--t:#fff;--t2:#f0f0f4;--tx:#1d1d1f;--mut:#6e6e73;--bd:rgba(0,0,0,.07);--sh:0 1px 2px rgba(0,0,0,.04),0 8px 30px rgba(0,0,0,.06);--bl:#0071e3;--pu:#7c3aed;--gr:#22c55e;--or:#ff9f0a;--pk:#ff375f;--cy:#06b6d4;--spring:cubic-bezier(.34,1.56,.64,1)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--t:#1c1c1e;--t2:#2c2c2e;--tx:#f5f5f7;--mut:#98989d;--bd:rgba(255,255,255,.09);--sh:0 1px 2px #0008,0 8px 30px #0006}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.top{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;background:color-mix(in srgb,var(--t) 78%,transparent);backdrop-filter:blur(24px) saturate(1.8);border:1px solid var(--bd);box-shadow:var(--sh);max-width:96vw;overflow-x:auto}
.top .lg{font-weight:900;letter-spacing:-.04em;padding:0 14px 0 12px;font-size:16px}.top .lg b{background:linear-gradient(90deg,var(--bl),var(--pu));-webkit-background-clip:text;background-clip:text;color:transparent}
.top a{padding:8px 15px;border-radius:999px;color:var(--mut);font-weight:600;font-size:13.5px;cursor:pointer;transition:.3s var(--spring);white-space:nowrap;position:relative}.top a:hover{color:var(--tx)}.top a.on{background:var(--tx);color:var(--bg);transform:scale(1.04)}
.top .badge{background:var(--pk);color:#fff;border-radius:10px;font-size:10px;padding:1px 6px;margin-left:5px;font-weight:800}
main{max-width:1240px;margin:0 auto;padding:96px 24px 80px}
h1{font-size:clamp(38px,6vw,68px);line-height:1;letter-spacing:-.045em;font-weight:900;margin:0 0 10px}h1 em{font-style:normal;background:linear-gradient(90deg,var(--bl),var(--pu),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:19px;color:var(--mut);max-width:620px;margin:0 0 30px;letter-spacing:-.01em}
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.tile{background:var(--t);border-radius:28px;padding:26px;box-shadow:var(--sh);border:1px solid var(--bd);position:relative;overflow:hidden;animation:pop .8s var(--spring) both;animation-delay:calc(var(--i,0)*70ms);transition:transform .45s var(--spring),box-shadow .3s;transform-style:preserve-3d}
.tile.hv:hover{transform:scale(1.015) translateY(-3px);box-shadow:0 20px 60px rgba(0,0,0,.14)}
@keyframes pop{from{opacity:0;transform:translateY(40px) scale(.92)}}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}.r2{grid-row:span 2}
@media(max-width:900px){.bento>*{grid-column:span 12!important;grid-row:auto!important}main{padding:90px 14px}}
.lab{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}.big{font-size:clamp(44px,6vw,84px);font-weight:900;letter-spacing:-.05em;line-height:1;margin:10px 0}.mid{font-size:52px;font-weight:900;letter-spacing:-.045em;line-height:1;margin-top:10px}
.hero{background:linear-gradient(135deg,#0071e3,#7c3aed 60%,#ff375f);color:#fff;border:0}.hero .lab{color:#ffffffc0}
.dark{background:#0b0b10;color:#fff;border:0}.dark .lab{color:#ffffff90}.dark::before{content:"";position:absolute;width:300px;height:300px;right:-80px;top:-100px;background:radial-gradient(#7c3aed99,transparent 65%);filter:blur(20px)}
.btn{font:700 13.5px Inter;border:0;padding:11px 20px;border-radius:999px;cursor:pointer;background:var(--tx);color:var(--bg);transition:.35s var(--spring)}.btn:hover{transform:scale(1.07)}.btn:active{transform:scale(.95)}
.btn.bl{background:var(--bl);color:#fff}.btn.gh{background:var(--t2);color:var(--tx)}.btn.wh{background:#fff;color:#111}.btn.sm{padding:7px 14px;font-size:12.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;background:var(--t2);color:var(--tx);border:2px solid transparent;border-radius:16px;padding:12px 16px;outline:0;transition:.25s}input:focus,textarea:focus{border-color:var(--bl);background:var(--t)}
.chip{padding:8px 16px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer;background:var(--t);border:1px solid var(--bd);color:var(--mut);transition:.35s var(--spring)}.chip:hover{transform:scale(1.06);color:var(--tx)}.chip.on{background:var(--tx);color:var(--bg)}
.pill{padding:3px 11px;border-radius:999px;font-size:11.5px;font-weight:700;text-transform:capitalize;white-space:nowrap}
.vip{background:#7c3aed22;color:#7c3aed}.new{background:#06b6d422;color:#0891b2}.active{background:#22c55e22;color:#16a34a}.at_risk{background:#ff9f0a26;color:#d97706}.churned{background:#ff375f22;color:#e11d48}.prospect{background:var(--t2);color:var(--mut)}
.skipped{background:var(--t2);color:var(--mut)}.completed,.sent{background:#22c55e22;color:#16a34a}.processing,.draft{background:#ff9f0a26;color:#d97706}.cancelled,.refunded,.failed{background:#ff375f22;color:#e11d48}.on-hold{background:var(--t2);color:var(--mut)}
.dark .vip{color:#c4b5fd}.hero .pill{background:#fff3;color:#fff}
.mut{color:var(--mut)}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.av{width:44px;height:44px;border-radius:15px;display:inline-grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex-shrink:0}
/* pipeline */
.pipe{display:flex;align-items:center;justify-content:space-between;position:relative;margin:34px 6px 8px;gap:8px}
.track{position:absolute;left:5%;right:5%;top:30px;height:4px;border-radius:4px;background:var(--t2);overflow:hidden}.track .fill{height:100%;width:0;background:linear-gradient(90deg,var(--bl),var(--pu),var(--pk));transition:width .5s ease}
.track .p{position:absolute;top:0;width:34px;height:4px;border-radius:4px;background:linear-gradient(90deg,transparent,#fff);animation:flow 2.8s linear infinite;opacity:.9}@keyframes flow{from{left:-40px}to{left:100%}}
.stage{position:relative;z-index:1;text-align:center;flex:1;min-width:0}.stage .ic{width:62px;height:62px;border-radius:21px;margin:0 auto 10px;display:grid;place-items:center;font-size:26px;background:var(--t2);border:1px solid var(--bd);transition:.5s var(--spring)}
.stage.lit .ic{transform:scale(1.25);background:linear-gradient(135deg,var(--bl),var(--pu));box-shadow:0 12px 40px #7c3aed77;color:#fff}.stage b{display:block;font-size:13.5px;letter-spacing:-.01em}.stage span{font-size:12px;color:var(--mut)}.stage .n{font-size:22px;font-weight:900;letter-spacing:-.03em;display:block;margin-top:2px;color:var(--tx)}
/* bars */
.bar{height:10px;border-radius:6px;background:var(--t2);overflow:hidden}.bar i{display:block;height:100%;width:0;border-radius:6px;transition:width 1.1s var(--spring)}
.seg{display:flex;align-items:center;gap:12px;margin:11px 0;font-weight:600;font-size:14px}.seg .bar{flex:1}.seg b{min-width:26px;text-align:right}
.feed>div{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd);animation:pop .6s var(--spring) both}.feed>div:last-child{border:0}.feed .d{width:10px;height:10px;border-radius:50%;margin-top:6px;flex-shrink:0}
.cgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.cgrid .tile{padding:22px;cursor:pointer}.cgrid .tile.w2{grid-column:span 2}.cgrid .tile.w2 .mid{font-size:60px}@media(max-width:700px){.cgrid .tile.w2{grid-column:auto}}
.stepper{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.stepper i{color:var(--mut);font-style:normal}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0}.node{padding:7px 13px;border-radius:12px;font-size:12.5px;font-weight:700}.node.t{background:#0071e322;color:var(--bl)}.node.cn{background:#ff9f0a22;color:#d97706}.node.a{background:#7c3aed22;color:var(--pu)}
.sw{position:relative;width:52px;height:32px;flex-shrink:0}.sw input{opacity:0;width:0;height:0}.sw span{position:absolute;inset:0;background:var(--t2);border-radius:20px;cursor:pointer;transition:.3s}.sw span:before{content:"";position:absolute;width:26px;height:26px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.4s var(--spring);box-shadow:0 2px 6px #0004}.sw input:checked+span{background:var(--gr)}.sw input:checked+span:before{transform:translateX(20px)}
.chat{display:flex;flex-direction:column;gap:12px;margin-bottom:18px;min-height:120px}.msg{padding:13px 18px;border-radius:24px;white-space:pre-wrap;max-width:86%;animation:pop .5s var(--spring)}.me{align-self:flex-end;background:var(--bl);color:#fff;border-bottom-right-radius:8px}.bot{background:var(--t2);border-bottom-left-radius:8px}
.tc{display:inline-block;margin:8px 6px 0 0;padding:3px 10px;border-radius:9px;background:var(--t);font:600 11px ui-monospace,monospace;color:var(--bl)}
.typing span{display:inline-block;width:8px;height:8px;margin:0 2px;border-radius:50%;background:var(--mut);animation:bn 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}@keyframes bn{50%{transform:translateY(-7px);background:var(--bl)}}
.scrim{position:fixed;inset:0;background:#0007;backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:.35s;z-index:20}.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;top:50%;width:min(640px,94vw);max-height:88vh;overflow:auto;background:var(--t);border-radius:32px;padding:30px;z-index:25;box-shadow:0 40px 120px #0007;transform:translate(-50%,-46%) scale(.86);opacity:0;pointer-events:none;transition:transform .55s var(--spring),opacity .25s}.sheet.open{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.stats3>div{background:var(--t2);border-radius:20px;padding:14px}.stats3 b{font-size:22px;letter-spacing:-.03em}
.tl{border-left:3px solid var(--t2);margin:10px 0 16px 6px;padding-left:18px}.tl>div{margin-bottom:12px}
.pal{position:fixed;top:16vh;left:50%;transform:translateX(-50%) scale(.9);width:min(580px,92vw);z-index:30;opacity:0;pointer-events:none;transition:.4s var(--spring);background:var(--t);border-radius:26px;box-shadow:0 40px 120px #0008;overflow:hidden}.pal.open{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.pal input{width:100%;border-radius:0;padding:22px 26px;font-size:18px;background:transparent;border:0;border-bottom:1px solid var(--bd)}.pal .it{padding:13px 26px;cursor:pointer;display:flex;gap:12px}.pal .it.sel,.pal .it:hover{background:var(--t2)}
.toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,90px) scale(.8);background:var(--tx);color:var(--bg);padding:13px 24px;border-radius:999px;font-weight:700;opacity:0;transition:.5s var(--spring);z-index:50;pointer-events:none;width:max-content;max-width:90vw;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.sk{height:22px;border-radius:10px;background:linear-gradient(90deg,var(--t),var(--t2),var(--t));background-size:200%;animation:sh 1.2s infinite;margin-bottom:14px}@keyframes sh{to{background-position:-200%}}
</style></head><body>
<div class="top"><div class="lg">Woo<b>CRM</b></div>
<a data-v="dash" class="on">Overview</a><a data-v="cust">Customers</a><a data-v="ord">Orders</a><a data-v="wf">Workflows</a><a data-v="comm">Messages<span class="badge" id="draftBadge" hidden></span></a><a data-v="agent">✦ AI</a>
<a onclick="pal(1)" title="Ctrl K">⌘K</a><a id="logout" onclick="logout()" hidden>Sign out</a></div>
<main id="main"></main>
<div class="scrim" id="scrim" onclick="closeAll()"></div><div class="sheet" id="panel"></div>
<div class="pal" id="pal"><input id="pq" placeholder="Search customers or type a command…" oninput="palRender()" onkeydown="palKey(event)"><div id="pres" style="max-height:340px;overflow:auto;padding:6px 0"></div></div><div class="toast" id="toast"></div>
<div class="scrim open" id="loginScrim" hidden style="z-index:60"></div><form class="sheet open" id="login" hidden style="z-index:61;width:min(420px,92vw);text-align:center" onsubmit="doLogin(event)"><div style="font-size:34px;font-weight:900;letter-spacing:-.04em">Woo<span style="color:var(--bl)">CRM</span></div><p class="mut" style="margin:6px 0 22px">Sign in to your workspace</p><input id="lu" placeholder="Username" autocomplete="username" style="width:100%;margin-bottom:12px"><input id="lp" type="password" placeholder="Password" autocomplete="current-password" style="width:100%;margin-bottom:14px"><div id="lerr" style="color:#e11d48;font-weight:600;min-height:22px;margin-bottom:6px"></div><button class="btn bl" style="width:100%">Sign in</button></form>
<script>
const $=s=>document.querySelector(s),api=(p,o={})=>fetch('/api'+p,{headers:{'Content-Type':'application/json'},...o,body:o.body&&JSON.stringify(o.body)}).then(r=>{if(r.status==401&&!p.startsWith('/auth/')){showLogin();return new Promise(()=>{})}return r.json()})
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const money=n=>'₹'+Math.round(n).toLocaleString('en-IN'),ago=d=>d?new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short'}):'—',wait=ms=>new Promise(r=>setTimeout(r,ms))
const pill=s=>`<span class="pill ${s}">${s.replace('_',' ')}</span>`
const COL={vip:'#7c3aed',active:'#22c55e',new:'#06b6d4',at_risk:'#ff9f0a',churned:'#ff375f',prospect:'#9ca3af'}
const GR=['#0071e3,#7c3aed','#ff375f,#ff9f0a','#06b6d4,#22c55e','#7c3aed,#ff375f','#ff9f0a,#22c55e']
const av=(n,s=44)=>`<span class="av" style="width:${s}px;height:${s}px;background:linear-gradient(135deg,${GR[(n.charCodeAt(0)+n.length)%5]})">${esc(n.split(' ').map(x=>x[0]).slice(0,2).join(''))}</span>`
let view='dash',tT;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>e.classList.remove('show'),2800)}
const cu=(to,f='n')=>`<span class="cu" data-to="${to}" data-f="${f}">0</span>`
function countUp(el){const to=+el.dataset.to,f=el.dataset.f,t0=performance.now();(function s(t){const p=Math.min((t-t0)/1100,1),e=1-Math.pow(1-p,4),v=to*e;el.textContent=f=='m'?money(v):Math.round(v);if(p<1)requestAnimationFrame(s)})(t0)}
function post(){document.querySelectorAll('.cu').forEach(countUp);requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w)))
 document.querySelectorAll('.tile.tilt').forEach(t=>{t.onmousemove=e=>{const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;t.style.transition='transform .1s';t.style.transform=`perspective(900px) rotateY(${x*7}deg) rotateX(${-y*7}deg) scale(1.01)`};t.onmouseleave=()=>{t.style.transition='';t.style.transform=''}})}
function nav(v){view=v;document.querySelectorAll('.top a[data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v==v));scrollTo({top:0,behavior:'smooth'});render()}
document.querySelectorAll('.top a[data-v]').forEach(a=>a.onclick=()=>nav(a.dataset.v))
async function badge(){const s=await api('/stats');const b=$('#draftBadge');b.hidden=!s.drafts;b.textContent=s.drafts;return s}
function spark(orders,w='#fff'){const W=600,H=150,wk=12,now=Date.now(),b=Array(wk).fill(0);orders.filter(o=>!['cancelled','refunded'].includes(o.status)).forEach(o=>{const i=wk-1-Math.floor((now-new Date(o.created_at))/6048e5);if(i>=0&&i<wk)b[i]+=o.total})
 const mx=Math.max(...b,1),pts=b.map((v,i)=>[i*W/(wk-1),H-10-(v/mx)*(H-28)]),d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:150px;margin-top:6px"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${w}" stop-opacity=".4"/><stop offset="1" stop-color="${w}" stop-opacity="0"/></linearGradient></defs><path d="${d} L${W} ${H} L0 ${H}Z" fill="url(#sg)"/><path d="${d}" fill="none" stroke="${w}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts[wk-1][0]}" cy="${pts[wk-1][1]}" r="6" fill="${w}"/></svg>`}
const STAGES=[['🛒','WooCommerce','store'],['🔐','Webhook','HMAC verified'],['🧠','CRM sync','profiles & segments'],['⚡','Workflows','rules engine'],['✉️','Inbox','messages out']]
async function runPipe(){const st=[...document.querySelectorAll('.stage')],fill=$('.track .fill');for(let i=0;i<st.length;i++){st.forEach(s=>s.classList.remove('lit'));st[i].classList.add('lit');fill.style.width=(i/(st.length-1)*100)+'%';await wait(520)}await wait(500);st.forEach(s=>s.classList.remove('lit'))}
const views={
async dash(){const[s,o,m,wf]=await Promise.all([badge(),api('/orders'),api('/communications'),api('/workflows')]);const agent=m.filter(x=>x.origin=='agent').length
 const N=[s.orders,'HMAC ✓',s.customers,wf.filter(w=>w.enabled).length,s.emails_sent]
 return `<h1>Your store,<br><em>understood.</em></h1><p class="lead">WooCRM turns every order into customer intelligence, and every customer moment into an automatic, personal message.</p>
 <div class="bento">
 <div class="tile hero tilt c7 r2" style="--i:0"><div class="lab">Total revenue</div><div class="big">${cu(s.revenue,'m')}</div><div>${spark(o)}</div><div class="row" style="margin-top:10px"><span class="pill">${s.orders} orders</span><span class="pill">last 12 weeks</span></div></div>
 <div class="tile hv c5" style="--i:1"><div class="lab">Customers</div><div class="mid">${cu(s.customers)}</div><div class="mut" style="margin-top:6px">${s.segments.vip} VIPs · ${s.segments.at_risk+s.segments.churned} need attention</div></div>
 <div class="tile hv c5" style="--i:2;background:#fff7e6"><div class="lab" style="color:#b45309">Awaiting your approval</div><div class="mid" style="color:#b45309">${cu(s.drafts)}</div><button class="btn sm" style="margin-top:12px" onclick="nav('comm')">Review drafts →</button></div>
 <div class="tile c12" style="--i:3"><div class="row" style="justify-content:space-between"><div><div class="lab">Live pipeline</div><div style="font-size:26px;font-weight:800;letter-spacing:-.03em">From checkout to inbox in milliseconds</div></div>
  <div class="row"><button class="btn bl" onclick="sim('new_order','new order')">＋ New order</button><button class="btn gh" onclick="sim('complete_order','order shipped')">✓ Ship order</button></div></div>
  <div class="pipe"><div class="track"><div class="fill"></div><i class="p"></i><i class="p" style="animation-delay:-.9s"></i><i class="p" style="animation-delay:-1.8s"></i></div>
  ${STAGES.map((g,i)=>`<div class="stage"><div class="ic">${g[0]}</div><b>${g[1]}</b><span class="n">${i==0||i==2||i==3||i==4?cu(N[i]):N[i]}</span><span>${g[2]}</span></div>`).join('')}</div></div>
 <div class="tile hv c5" style="--i:4"><div class="lab">Segments</div><div style="margin-top:12px">${Object.entries(s.segments).map(([k,v])=>`<div class="seg"><span style="width:78px;text-transform:capitalize">${k.replace('_',' ')}</span><div class="bar"><i style="background:${COL[k]}" data-w="${v/s.customers*100}%"></i></div><b>${v}</b></div>`).join('')}</div></div>
 <div class="tile dark hv c7" style="--i:5"><div class="lab">✦ AI retention agent</div><div style="font-size:30px;font-weight:800;letter-spacing:-.035em;margin:10px 0;max-width:420px;position:relative">Wins back customers while you sleep.</div><div style="color:#ffffffa0;max-width:430px;position:relative">It finds at-risk customers, writes personal win-back emails, and waits for your approval. ${agent?`<b style="color:#fff">${agent} drafted so far.</b>`:''}</div>
  <div class="row" style="margin-top:18px;position:relative"><button class="btn wh" onclick="act('/agent/retention-run','',null,r=>toast('✦ Agent drafted '+r.drafts.length+' win-back emails'))">Run agent</button><button class="btn" style="background:#ffffff22" onclick="nav('agent')">Chat with it</button></div></div>
 <div class="tile hv c4" style="--i:6"><div class="lab">Order pipeline</div><div style="margin-top:12px">${Object.entries(s.order_status).map(([k,v])=>`<div class="seg"><span style="width:84px">${pill(k)}</span><div class="bar"><i style="background:linear-gradient(90deg,var(--bl),var(--pu))" data-w="${v/s.orders*100}%"></i></div><b>${v}</b></div>`).join('')}</div></div>
 <div class="tile hv c8" style="--i:7"><div class="lab">Live activity</div><div class="feed" style="margin-top:6px">${m.slice(0,5).map(c=>`<div><span class="d" style="background:${c.status=='draft'?'var(--or)':'var(--gr)'}"></span><div style="flex:1"><b>${esc(c.subject)}</b><div class="mut">${esc(c.customer)} · ${c.origin=='agent'?'✦ AI agent':c.origin}</div></div>${pill(c.status)}</div>`).join('')||'<div class="mut">Nothing yet — try “New order” above.</div>'}</div></div>
 </div>`},
async cust(){const q=window._q||'',sg=window._sg||'',rows=await api(`/customers?segment=${sg}&q=${encodeURIComponent(q)}`)
 return `<h1>Your <em>customers.</em></h1><p class="lead">${rows.length} people. Tap anyone for their full story.</p>
 <div class="row" style="margin-bottom:22px"><input id="q" placeholder="Search…" value="${esc(q)}" style="min-width:240px" oninput="window._q=this.value;clearTimeout(window._t);window._t=setTimeout(()=>render(1),250)">${['',...Object.keys(COL)].map(s=>`<span class="chip ${s==sg?'on':''}" onclick="window._sg='${s}';render()">${s?s.replace('_',' '):'All'}</span>`).join('')}</div>
 <div class="cgrid">${rows.map((c,i)=>`<div class="tile hv ${c.segment=='vip'?'w2':''}" style="--i:${Math.min(i,14)}" onclick="openCust(${c.id})"><div class="row" style="justify-content:space-between">${av(c.name)}${pill(c.segment)}</div><div style="margin-top:14px;font-weight:700;font-size:17px;letter-spacing:-.02em">${esc(c.name)}</div><div class="mut" style="font-size:13px">${esc(c.email)}</div><div class="mid">${money(c.total_spent)}</div><div class="mut" style="margin:4px 0 10px">${c.order_count} orders · last ${ago(c.last_order_at)}</div><div class="bar"><i style="background:linear-gradient(90deg,var(--bl),var(--pu))" data-w="${c.rfm/15*100}%"></i></div>${c.tags.length?`<div class="row" style="margin-top:10px">${c.tags.map(t=>`<span class="pill prospect">${esc(t)}</span>`).join('')}</div>`:''}</div>`).join('')}</div>`},
async ord(){const st=window._st||'',rows=await api('/orders?status='+st)
 return `<h1>Every <em>order,</em><br>tracked.</h1><p class="lead">Live status history, straight from WooCommerce.</p><div class="row" style="margin-bottom:22px">${['','processing','on-hold','completed','cancelled','refunded'].map(s=>`<span class="chip ${s==st?'on':''}" onclick="window._st='${s}';render()">${s||'All'}</span>`).join('')}</div>
 <div class="bento">${rows.slice(0,60).map((o,i)=>`<div class="tile hv c4" style="--i:${Math.min(i,12)}"><div class="row" style="justify-content:space-between"><b class="mono">#${o.number}</b><span class="mut">${ago(o.created_at)}</span></div><div class="mid" style="font-size:40px">${money(o.total)}</div><a style="cursor:pointer;font-weight:600" onclick="openCust(${o.customer_id})">${esc(o.customer)}</a><div class="mut" style="font-size:13px;margin:4px 0 12px">${o.items.map(x=>esc(x.name)+' ×'+x.quantity).join(', ')}</div><div class="stepper">${o.history.map((h,j)=>(j?'<i>→</i>':'')+pill(h.status)).join('')}</div></div>`).join('')}</div>`},
async wf(){const rows=await api('/workflows')
 return `<h1>Automate the <em>follow-up.</em></h1><p class="lead">When something happens, the CRM responds. Once per customer and order, never twice.</p>
 <div class="bento">${rows.map((w,i)=>`<div class="tile hv c6" style="--i:${i}"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b style="font-size:19px;letter-spacing:-.02em">${esc(w.name)}</b><label class="sw"><input type="checkbox" ${w.enabled?'checked':''} onchange="api('/workflows/${w.id}?enabled='+this.checked,{method:'PATCH'}).then(()=>toast('Workflow '+(this.checked?'on':'paused')))"><span></span></label></div>
 <div class="flow"><span class="node t">⚡ ${esc(w.trigger)}</span>${Object.keys(w.conditions).length?`<i class="mut">→</i><span class="node cn">if ${esc(Object.entries(w.conditions).map(([k,v])=>k+' '+v).join(', '))}</span>`:''}<i class="mut">→</i><span class="node a">${w.action=='add_tag'?'🏷 tag '+esc(w.tag):'✉️ send email'}</span></div><div class="mut">${esc(w.subject)}</div></div>`).join('')}
 <div class="tile c12" style="--i:9"><div class="lab">New workflow</div><div class="row" style="margin-top:12px"><input id="n" placeholder="Name" style="flex:1;min-width:160px"><select id="t"><option>customer.created</option><option>order.created</option><option>order.status:completed</option><option>order.status:processing</option><option>order.status:cancelled</option><option>segment.changed</option></select><input id="s" placeholder="Subject — Hi {{first_name}}" style="flex:2;min-width:200px"><input id="b" placeholder="Body — {{order_number}}" style="flex:2;min-width:200px"><button class="btn bl" onclick="addWf()">Create</button></div></div></div>`},
async comm(){const rows=await api('/communications');await badge()
 return `<h1>Every <em>message.</em></h1><p class="lead">Sent by workflows, drafted by AI. Nothing leaves without your say-so.</p>
 <div class="bento">${rows.map((m,i)=>`<div class="tile hv c6" style="--i:${Math.min(i,12)}"><div class="row" style="flex-wrap:nowrap">${av(m.customer||'?',40)}<div style="flex:1;min-width:0"><b>${esc(m.subject)}</b><div class="mut" style="font-size:13px">To ${esc(m.customer)} · ${m.origin=='agent'?'✦ AI agent':m.origin} · ${ago(m.created_at)}</div></div>${pill(m.status)}</div><p style="margin:14px 0 0">${esc(m.body)}</p>${m.status=='draft'?`<button class="btn bl" style="margin-top:14px" onclick="act('/communications/${m.id}/approve','✓ Approved & sent')">Approve & send</button>`:''}</div>`).join('')||'<div class="tile c12">No messages yet — create an order on the Overview.</div>'}</div>`},
async agent(){return `<h1>Ask your <em>CRM.</em></h1><p class="lead">A Claude-powered agent with live access to your customers. It drafts — you decide.</p>
 <div class="bento"><div class="tile c12" style="--i:0"><div class="row" style="margin-bottom:18px">${['Give me an overview','Who are my VIP customers?','Show at risk customers','Draft win-back emails'].map(q=>`<span class="chip" onclick="ask('${q}')">${q}</span>`).join('')}</div>
 <div class="chat" id="chat">${(window._chat||[]).join('')||'<div class="msg bot">Hi! Ask about segments, VIPs or at-risk customers — or have me draft win-back emails.</div>'}</div>
 <div class="row" style="flex-wrap:nowrap"><input id="msg" style="flex:1" placeholder="Ask anything about your customers…" onkeydown="if(event.key=='Enter')ask()"><button class="btn bl" onclick="ask()">Send</button></div></div></div>`}}
async function render(keep){const m=$('#main');if(!keep)m.innerHTML='<div class="sk" style="width:50%;height:60px"></div><div class="sk" style="width:35%"></div><div class="sk" style="height:220px;border-radius:28px"></div>';const f=document.activeElement&&document.activeElement.id=='q';m.innerHTML=await views[view]();post();if(f){const q=$('#q');q.focus();q.setSelectionRange(99,99)}}
async function act(p,msg,body,cb){const r=await api(p,{method:'POST',body});if(r.detail)return toast(r.detail);msg&&toast(msg);cb&&cb(r);render(1)}
async function sim(a,label){const pipe=runPipe();const r=await api('/mock/simulate',{method:'POST',body:{action:a}});await pipe;if(r.detail)return toast(r.detail);toast('✓ '+label+' · webhook verified & workflows ran');render(1)}
async function ask(q){const i=$('#msg');q=q||(i&&i.value);if(!q)return;window._chat=window._chat||[];window._chat.push(`<div class="msg me">${esc(q)}</div>`);if(view!='agent')nav('agent');else await render(1);$('#chat').insertAdjacentHTML('beforeend','<div class="msg bot typing"><span></span><span></span><span></span></div>')
 const r=await api('/agent/chat',{method:'POST',body:{message:q}});window._chat.push(`<div class="msg bot">${esc(r.reply)}<div>${r.tool_calls.map(t=>`<span class="tc">⚙ ${t.tool}(${esc(JSON.stringify(t.args))})</span>`).join('')}<span class="tc">engine: ${r.engine}</span></div></div>`);render(1)}
async function addWf(){await api('/workflows',{method:'POST',body:{name:$('#n').value||'Untitled',trigger:$('#t').value,subject:$('#s').value,body:$('#b').value}});toast('Workflow created ✓');render(1)}
function closeAll(){$('#panel').classList.remove('open');$('#scrim').classList.remove('open');pal(0)}
async function openCust(id){pal(0);const c=await api('/customers/'+id);$('#panel').classList.add('open');$('#scrim').classList.add('open')
 $('#panel').innerHTML=`<button class="btn gh sm" onclick="closeAll()" style="float:right">✕</button><div class="row" style="flex-wrap:nowrap">${av(c.name,60)}<div><div style="font-size:30px;font-weight:900;letter-spacing:-.04em;line-height:1.1">${esc(c.name)}</div><div class="mut">${esc(c.email)} · ${esc(c.city)}</div></div></div>
 <div class="stats3"><div><div class="mut">Segment</div>${pill(c.segment)}</div><div><div class="mut">Lifetime value</div><b>${money(c.total_spent)}</b></div><div><div class="mut">RFM</div><b>${c.rfm}/15</b></div></div>
 <div class="mut">Tags (comma separated)</div><input id="tg" value="${esc(c.tags.join(', '))}" style="width:100%;margin:6px 0 12px"><div class="mut">Notes</div><textarea id="nt" rows="3" style="width:100%;margin:6px 0 12px">${esc(c.notes)}</textarea><div class="row"><button class="btn bl" onclick="saveC(${c.id})">Save</button><button class="btn gh" onclick="ask('Tell me about ${esc(c.name).replace(/'/g,'')}');closeAll()">✦ Ask AI</button></div>
 <h3 style="margin:22px 0 0">Orders</h3><div class="tl">${c.orders.map(o=>`<div><b class="mono">#${o.number}</b> · ${money(o.total)}<div class="stepper" style="margin-top:4px">${o.history.map((h,j)=>(j?'<i>→</i>':'')+pill(h.status)).join('')}</div></div>`).join('')||'<div class="mut">No orders</div>'}</div>
 <h3 style="margin:0">Messages</h3><div class="tl">${c.communications.map(m=>`<div><b>${esc(m.subject)}</b> ${pill(m.status)}<div class="mut">${esc(m.body)}</div></div>`).join('')||'<div class="mut">None</div>'}</div>`}
async function saveC(id){await api('/customers/'+id,{method:'PATCH',body:{tags:$('#tg').value.split(','),notes:$('#nt').value}});toast('Saved ✓');render(1)}
let P=[],sel=0;const CMDS=[['dash','Go to Overview','▣'],['cust','Go to Customers','👥'],['ord','Go to Orders','📦'],['wf','Go to Workflows','⚡'],['comm','Go to Messages','✉️'],['agent','Open AI agent','✦']]
function pal(o){$('#pal').classList.toggle('open',!!o);$('#scrim').classList.toggle('open',!!o);if(o){$('#pq').value='';palRender();setTimeout(()=>$('#pq').focus(),60)}}
async function palRender(){const q=$('#pq').value.trim();P=CMDS.filter(c=>c[1].toLowerCase().includes(q.toLowerCase())).map(c=>({i:c[2],t:c[1],f:()=>{closeAll();nav(c[0])}}))
 if(q){P.unshift({i:'✦',t:'Ask AI: “'+q+'”',f:()=>{closeAll();ask(q)}});const cs=await api('/customers?q='+encodeURIComponent(q));P.push(...cs.slice(0,5).map(c=>({i:'👤',t:c.name+' — '+c.segment.replace('_',' '),f:()=>openCust(c.id)})))}sel=0;drawPal()}
function drawPal(){$('#pres').innerHTML=P.map((p,i)=>`<div class="it ${i==sel?'sel':''}" onclick="P[${i}].f()"><span>${p.i}</span>${esc(p.t)}</div>`).join('')}
function palKey(e){if(e.key=='ArrowDown'){sel=Math.min(sel+1,P.length-1);drawPal();e.preventDefault()}else if(e.key=='ArrowUp'){sel=Math.max(sel-1,0);drawPal();e.preventDefault()}else if(e.key=='Enter'&&P[sel])P[sel].f()}
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='k'){e.preventDefault();pal(1)}if(e.key=='Escape')closeAll()})
function showLogin(){$('#loginScrim').hidden=false;$('#login').hidden=false;setTimeout(()=>$('#lu').focus(),50)}
async function doLogin(e){e.preventDefault();const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#lu').value,password:$('#lp').value})});
 if(r.ok){$('#loginScrim').hidden=true;$('#login').hidden=true;$('#lp').value='';$('#lerr').textContent='';boot()}else{$('#lerr').textContent=(await r.json()).detail||'Sign-in failed';$('#lp').value=''}}
async function logout(){await fetch('/api/auth/logout',{method:'POST'});location.reload()}
async function boot(){const me=await fetch('/api/auth/me').then(r=>r.json());$('#logout').hidden=!me.auth_required;if(me.auth_required&&!me.authenticated)return showLogin();render()}
boot()
</script></body></html>

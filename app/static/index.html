<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WooCRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070d;--g:rgba(255,255,255,.045);--g2:rgba(255,255,255,.08);--bd:rgba(255,255,255,.09);--tx:#f1f1f7;--mut:#9a9ab0;--v:#8b5cf6;--c:#22d3ee;--p:#f472b6;--ok:#34d399;--w:#fbbf24;--bad:#fb7185}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 Inter,system-ui,sans-serif;min-height:100vh;display:flex;overflow-x:hidden}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden}.aurora i{position:absolute;border-radius:50%;filter:blur(110px);opacity:.38;animation:float 22s ease-in-out infinite}
.aurora i:nth-child(1){width:520px;height:520px;background:#7c3aed;top:-140px;left:-120px}.aurora i:nth-child(2){width:460px;height:460px;background:#0891b2;bottom:-160px;right:-100px;animation-delay:-8s}.aurora i:nth-child(3){width:360px;height:360px;background:#db2777;top:40%;left:45%;opacity:.2;animation-delay:-15s}
@keyframes float{50%{transform:translate(70px,50px) scale(1.12)}}
nav{width:232px;padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;flex-shrink:0;background:rgba(10,10,20,.5);backdrop-filter:blur(24px);border-right:1px solid var(--bd)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;padding:2px 10px 22px;letter-spacing:-.02em}
.logo .m{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--v),var(--c));display:grid;place-items:center;box-shadow:0 0 22px #8b5cf688;font-size:16px}
nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--mut);cursor:pointer;font-weight:500;transition:.18s;position:relative}
nav a svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a:hover{color:var(--tx);background:var(--g)}nav a.on{color:#fff;background:linear-gradient(90deg,#8b5cf633,#22d3ee11);box-shadow:inset 0 0 0 1px #8b5cf655}
nav .badge{margin-left:auto;background:linear-gradient(135deg,var(--w),var(--p));color:#1a1030;border-radius:10px;padding:0 7px;font-size:11px;font-weight:800}
.side-foot{margin-top:auto;padding:12px;border-radius:14px;background:var(--g);border:1px solid var(--bd);font-size:12px;color:var(--mut)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);margin-right:6px;animation:pulse 2s infinite}@keyframes pulse{50%{opacity:.4}}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:16px 32px;position:sticky;top:0;z-index:4;backdrop-filter:blur(18px);background:rgba(7,7,13,.55);border-bottom:1px solid var(--bd)}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:12px;background:var(--g);border:1px solid var(--bd);color:var(--mut);cursor:pointer;transition:.18s}.search:hover{border-color:#8b5cf688}
kbd{font:500 11px 'JetBrains Mono',monospace;background:var(--g2);padding:2px 7px;border-radius:6px;margin-left:auto}
main{padding:28px 32px 60px;animation:in .45s cubic-bezier(.2,.8,.2,1)}@keyframes in{from{opacity:0;transform:translateY(12px)}}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.03em}.grad{background:linear-gradient(90deg,#fff,#c4b5fd 50%,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{color:var(--mut);margin:4px 0 22px}
.glass{background:var(--g);border:1px solid var(--bd);border-radius:20px;padding:20px;backdrop-filter:blur(20px);box-shadow:0 8px 40px #0006;transition:.25s}.glass.hv:hover{transform:translateY(-3px);border-color:#8b5cf666;box-shadow:0 14px 50px #8b5cf622}
.kpis{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:18px}
.kpi .k{color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}.kpi .v{font-size:34px;font-weight:800;letter-spacing:-.03em;margin-top:6px}.kpi .ic{float:right;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:17px}
.row2{display:grid;gap:16px;grid-template-columns:1.6fr 1fr;margin-bottom:16px}.row3{display:grid;gap:16px;grid-template-columns:1fr 1fr}
@media(max-width:1000px){.row2,.row3{grid-template-columns:1fr}nav{display:none}header,main{padding-left:16px;padding-right:16px}}
.btn{font:600 13px Inter;border:0;color:#fff;padding:9px 16px;border-radius:11px;cursor:pointer;background:linear-gradient(135deg,var(--v),#6366f1);box-shadow:0 4px 20px #8b5cf655;transition:.18s}.btn:hover{transform:translateY(-1px);filter:brightness(1.12)}.btn:active{transform:none}
.btn.gh{background:var(--g2);box-shadow:none;border:1px solid var(--bd);color:var(--tx)}.btn.sm{padding:6px 12px;font-size:12px}
.bar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;background:var(--g);color:var(--tx);border:1px solid var(--bd);border-radius:11px;padding:9px 14px;outline:0;transition:.18s}input:focus,textarea:focus,select:focus{border-color:var(--v);box-shadow:0 0 0 3px #8b5cf633}select option{background:#12121f}
.chip{padding:5px 13px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;background:var(--g);border:1px solid var(--bd);color:var(--mut);transition:.18s}.chip.on,.chip:hover{color:#fff;border-color:var(--v);background:#8b5cf633}
table{width:100%;border-collapse:separate;border-spacing:0 6px}th{text-align:left;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:4px 14px;font-weight:600}
td{padding:12px 14px;background:var(--g);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}td:first-child{border-left:1px solid var(--bd);border-radius:14px 0 0 14px}td:last-child{border-right:1px solid var(--bd);border-radius:0 14px 14px 0}tr.r{cursor:pointer;transition:.18s}tr.r:hover td{background:var(--g2);border-color:#8b5cf655}
.av{width:36px;height:36px;border-radius:12px;display:inline-grid;place-items:center;font-weight:700;font-size:13px;color:#fff;margin-right:12px;vertical-align:middle;flex-shrink:0}
.pill{padding:3px 11px;border-radius:20px;font-size:11.5px;font-weight:700;text-transform:capitalize;white-space:nowrap}
.vip{color:#ddd6fe;background:#8b5cf63a;box-shadow:0 0 14px #8b5cf644}.new{color:#a5f3fc;background:#22d3ee26}.active{color:#a7f3d0;background:#34d39922}.at_risk{color:#fde68a;background:#fbbf2426}.churned{color:#fecdd3;background:#fb718526}.prospect{color:var(--mut);background:var(--g2)}
.completed,.sent{color:#a7f3d0;background:#34d39922}.processing,.draft{color:#fde68a;background:#fbbf2426}.cancelled,.refunded,.failed{color:#fecdd3;background:#fb718526}.on-hold{color:var(--mut);background:var(--g2)}
.mut{color:var(--mut)}.mono{font-family:'JetBrains Mono',monospace;font-size:12px}
.donut{display:flex;align-items:center;gap:22px;flex-wrap:wrap}.donut svg{width:170px;height:170px;transform:rotate(-90deg);flex-shrink:0}.donut circle{fill:none;stroke-width:15;stroke-linecap:round;transition:stroke-dasharray 1s cubic-bezier(.2,.8,.2,1)}
.leg div{display:flex;align-items:center;gap:9px;margin:6px 0;font-size:13px}.leg i{width:10px;height:10px;border-radius:4px}.leg b{margin-left:auto;padding-left:18px}
.feed div{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd);animation:in .4s both}.feed div:last-child{border:0}.feed .d{width:8px;height:8px;border-radius:50%;margin-top:7px;flex-shrink:0}
.stepper{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.stepper i{color:var(--mut);font-style:normal}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}.node{padding:6px 12px;border-radius:10px;font-size:12px;font-weight:600;border:1px solid var(--bd)}.node.t{background:#22d3ee1c;color:#a5f3fc}.node.cn{background:#fbbf2418;color:#fde68a}.node.a{background:#8b5cf624;color:#ddd6fe}
.wfs{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.sw{position:relative;width:42px;height:24px;flex-shrink:0}.sw input{opacity:0;width:0;height:0}.sw span{position:absolute;inset:0;background:var(--g2);border-radius:20px;cursor:pointer;transition:.25s;border:1px solid var(--bd)}.sw span:before{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.25s}.sw input:checked+span{background:linear-gradient(135deg,var(--v),var(--c))}.sw input:checked+span:before{transform:translateX(18px)}
.mail{display:grid;gap:12px}.mail .glass{display:flex;gap:16px;align-items:flex-start;padding:16px 18px}.mail .glass>div:nth-child(2){flex:1;min-width:0}
.panel{position:fixed;right:0;top:0;height:100vh;width:min(540px,100%);background:rgba(12,12,24,.92);backdrop-filter:blur(30px);border-left:1px solid var(--bd);padding:28px;overflow:auto;transform:translateX(105%);transition:.4s cubic-bezier(.2,.8,.2,1);z-index:20}.panel.open{transform:none}
.scrim{position:fixed;inset:0;background:#0008;opacity:0;pointer-events:none;transition:.3s;z-index:15}.scrim.open{opacity:1;pointer-events:auto}
.tl{border-left:2px solid var(--bd);margin:10px 0 14px 8px;padding-left:18px}.tl>div{margin-bottom:12px;position:relative}.tl>div:before{content:"";position:absolute;left:-24px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--v);box-shadow:0 0 10px var(--v)}
.chat{display:flex;flex-direction:column;gap:12px;max-width:820px;margin-bottom:16px}.msg{padding:12px 16px;border-radius:18px;white-space:pre-wrap;max-width:88%;animation:in .3s}.me{align-self:flex-end;background:linear-gradient(135deg,var(--v),#6366f1);border-bottom-right-radius:5px}.bot{background:var(--g);border:1px solid var(--bd);border-bottom-left-radius:5px}
.tc{display:inline-block;margin:8px 6px 0 0;padding:3px 10px;border-radius:8px;background:#22d3ee18;color:#a5f3fc;font:500 11px 'JetBrains Mono',monospace}
.typing span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--mut);animation:bounce 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}@keyframes bounce{50%{transform:translateY(-6px);background:var(--c)}}
.pal{position:fixed;top:14vh;left:50%;transform:translateX(-50%) scale(.96);width:min(580px,92vw);z-index:30;opacity:0;pointer-events:none;transition:.2s;background:rgba(14,14,28,.96);backdrop-filter:blur(30px);border:1px solid #8b5cf666;border-radius:20px;box-shadow:0 30px 100px #000a,0 0 60px #8b5cf633;overflow:hidden}.pal.open{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.pal input{width:100%;border:0;border-bottom:1px solid var(--bd);border-radius:0;padding:18px 22px;font-size:16px;background:transparent}.pal input:focus{box-shadow:none}
.pal .it{padding:11px 22px;cursor:pointer;display:flex;gap:12px;align-items:center}.pal .it.sel,.pal .it:hover{background:#8b5cf62a}.pal .res{max-height:340px;overflow:auto}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,30px);background:linear-gradient(135deg,var(--v),var(--c));color:#fff;padding:11px 20px;border-radius:14px;font-weight:600;opacity:0;transition:.35s;z-index:50;box-shadow:0 10px 40px #8b5cf666;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.sk{height:18px;border-radius:8px;background:linear-gradient(90deg,var(--g),var(--g2),var(--g));background-size:200%;animation:sh 1.2s infinite;margin-bottom:12px}@keyframes sh{to{background-position:-200%}}
</style></head><body>
<div class="aurora"><i></i><i></i><i></i></div>
<nav><div class="logo"><div class="m">⚡</div><span>Woo<span class="grad">CRM</span></span></div>
<a data-v="dash" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Dashboard</a>
<a data-v="cust"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7"/><path d="M16 4a4 4 0 010 8M22 21c0-3-2-5-4-6"/></svg>Customers</a>
<a data-v="ord"><svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Orders</a>
<a data-v="wf"><svg viewBox="0 0 24 24"><circle cx="5" cy="6" r="2.5"/><circle cx="19" cy="12" r="2.5"/><circle cx="5" cy="18" r="2.5"/><path d="M7.5 6h4a3 3 0 013 3v0M7.5 18h4a3 3 0 003-3v0"/></svg>Workflows</a>
<a data-v="comm"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 8l9 6 9-6"/></svg>Messages<span class="badge" id="draftBadge" hidden></span></a>
<a data-v="agent"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg>AI Agent</a>
<div class="side-foot"><span class="dot"></span>Connected to <b id="src">store</b><div style="margin-top:4px">Webhooks live · HMAC verified</div></div></nav>
<div class="wrap"><header><div class="search" onclick="pal(1)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>Search customers, jump to…<kbd>Ctrl K</kbd></div>
<div style="margin-left:auto;display:flex;gap:10px"><button class="btn gh sm" onclick="act('/sync','Synced from WooCommerce')">⟳ Sync</button><button class="btn sm" onclick="nav('agent')">✦ Ask AI</button></div></header>
<main id="main"></main></div>
<div class="scrim" id="scrim" onclick="closeAll()"></div><div class="panel" id="panel"></div>
<div class="pal" id="pal"><input id="pq" placeholder="Type a customer name or a command…" oninput="palRender()" onkeydown="palKey(event)"><div class="res" id="pres"></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),api=(p,o={})=>fetch('/api'+p,{headers:{'Content-Type':'application/json'},...o,body:o.body&&JSON.stringify(o.body)}).then(r=>r.json())
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const money=n=>'₹'+Math.round(n).toLocaleString('en-IN'),ago=d=>d?new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short'}):'—'
const pill=s=>`<span class="pill ${s}">${s.replace('_',' ')}</span>`
const COL={vip:'#8b5cf6',active:'#34d399',new:'#22d3ee',at_risk:'#fbbf24',churned:'#fb7185',prospect:'#64748b'}
const GR=['#8b5cf6,#22d3ee','#f472b6,#8b5cf6','#22d3ee,#34d399','#fbbf24,#f472b6','#6366f1,#22d3ee']
const av=n=>`<span class="av" style="background:linear-gradient(135deg,${GR[(n.charCodeAt(0)+n.length)%5]})">${esc(n.split(' ').map(x=>x[0]).slice(0,2).join(''))}</span>`
let view='dash',tT;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>e.classList.remove('show'),2600)}
function countUp(el){const to=+el.dataset.to,f=el.dataset.f,t0=performance.now();(function s(t){const p=Math.min((t-t0)/900,1),e=1-Math.pow(1-p,3),v=to*e;el.textContent=f=='m'?money(v):Math.round(v);if(p<1)requestAnimationFrame(s)})(t0)}
const cu=(to,f='n')=>`<span data-to="${to}" data-f="${f}" class="cu">0</span>`
function nav(v){view=v;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v==v));render()}
document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>nav(a.dataset.v))
async function badge(){const s=await api('/stats');const b=$('#draftBadge');b.hidden=!s.drafts;b.textContent=s.drafts;return s}
function spark(orders){const W=640,H=170,wk=12,now=Date.now(),b=Array(wk).fill(0);orders.filter(o=>!['cancelled','refunded'].includes(o.status)).forEach(o=>{const i=wk-1-Math.floor((now-new Date(o.created_at))/6048e5);if(i>=0&&i<wk)b[i]+=o.total})
 const mx=Math.max(...b,1),pts=b.map((v,i)=>[i*W/(wk-1),H-12-(v/mx)*(H-30)]),d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:190px"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".55"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient><linearGradient id="lg"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
 <path d="${d} L${W} ${H} L0 ${H}Z" fill="url(#ag)"/><path d="${d}" fill="none" stroke="url(#lg)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#fff"/>`).join('')}</svg><div class="mut" style="display:flex;justify-content:space-between;font-size:11px"><span>12 weeks ago</span><span>this week</span></div>`}
function donut(seg){const tot=Object.values(seg).reduce((a,b)=>a+b,0)||1,C=2*Math.PI*62;let off=0
 const arcs=Object.entries(seg).filter(e=>e[1]).map(([k,v])=>{const l=v/tot*C,s=`<circle cx="85" cy="85" r="62" stroke="${COL[k]}" stroke-dasharray="${Math.max(l-4,1)} ${C}" stroke-dashoffset="${-off}"/>`;off+=l;return s}).join('')
 return `<div class="donut"><svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="62" stroke="rgba(255,255,255,.06)"/>${arcs}</svg><div class="leg">${Object.entries(seg).map(([k,v])=>`<div><i style="background:${COL[k]}"></i>${k.replace('_',' ')}<b>${v}</b></div>`).join('')}</div></div>`}
const views={
async dash(){const[s,o,m]=await Promise.all([badge(),api('/orders'),api('/communications')])
 const K=[['Customers',s.customers,'n','👥','#8b5cf633'],['Revenue',s.revenue,'m','💰','#34d39933'],['Orders',s.orders,'n','📦','#22d3ee33'],['Emails sent',s.emails_sent,'n','✉️','#f472b633'],['Awaiting approval',s.drafts,'n','⏳','#fbbf2433']]
 return `<h1><span class="grad">Good day 👋</span></h1><div class="sub">Your WooCommerce customers, orders and automations at a glance</div>
 <div class="bar"><button class="btn" onclick="act('/mock/simulate','Webhook delivered ✓ new order',{action:'new_order'})">＋ Simulate new order</button><button class="btn gh" onclick="act('/mock/simulate','Webhook delivered ✓ order completed',{action:'complete_order'})">✓ Simulate order shipped</button><button class="btn gh" onclick="act('/agent/retention-run','',null,r=>toast('Agent drafted '+r.drafts.length+' win-back emails'))">✦ Run retention agent</button></div>
 <div class="kpis">${K.map(([k,v,f,i,bg])=>`<div class="glass kpi hv"><span class="ic" style="background:${bg}">${i}</span><div class="k">${k}</div><div class="v">${cu(v,f)}</div></div>`).join('')}</div>
 <div class="row2"><div class="glass"><b>Revenue · last 12 weeks</b>${spark(o)}</div><div class="glass"><b>Customer segments</b><div style="margin-top:14px">${donut(s.segments)}</div></div></div>
 <div class="row3"><div class="glass"><b>Order pipeline</b><div style="margin-top:14px">${Object.entries(s.order_status).map(([k,v])=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between">${pill(k)}<b>${v}</b></div><div style="height:6px;border-radius:4px;background:var(--g2);margin-top:6px"><div style="height:100%;border-radius:4px;width:${v/s.orders*100}%;background:linear-gradient(90deg,var(--v),var(--c))"></div></div></div>`).join('')}</div></div>
 <div class="glass"><b>Live activity</b><div class="feed" style="margin-top:8px">${m.slice(0,6).map(c=>`<div><span class="d" style="background:${c.status=='draft'?'var(--w)':'var(--ok)'}"></span><div><b>${esc(c.subject)}</b><div class="mut">${esc(c.customer)} · ${c.origin} · ${c.status}</div></div></div>`).join('')||'<div class="mut">No activity yet — simulate an order above.</div>'}</div></div></div>`},
async cust(){const q=window._q||'',sg=window._sg||'',rows=await api(`/customers?segment=${sg}&q=${encodeURIComponent(q)}`)
 return `<h1><span class="grad">Customers</span></h1><div class="sub">${rows.length} customers · click anyone for the 360° view</div>
 <div class="bar"><input id="q" placeholder="Search name or email…" value="${esc(q)}" style="min-width:260px" oninput="window._q=this.value;clearTimeout(window._t);window._t=setTimeout(()=>render(1),250)">
 ${['',...Object.keys(COL)].map(s=>`<span class="chip ${s==sg?'on':''}" onclick="window._sg='${s}';render()">${s?s.replace('_',' '):'All'}</span>`).join('')}</div>
 <table><tr><th>Customer</th><th>Segment</th><th>Orders</th><th>Lifetime value</th><th>RFM</th><th>Last order</th><th>Tags</th></tr>
 ${rows.map(c=>`<tr class="r" onclick="openCust(${c.id})"><td>${av(c.name)}<b>${esc(c.name)}</b> <span class="mut">${esc(c.email)}</span></td><td>${pill(c.segment)}</td><td>${c.order_count}</td><td><b>${money(c.total_spent)}</b></td><td><div style="width:70px;height:6px;border-radius:4px;background:var(--g2)"><div style="height:100%;border-radius:4px;width:${c.rfm/15*100}%;background:linear-gradient(90deg,var(--v),var(--c))"></div></div></td><td class="mut">${ago(c.last_order_at)}</td><td>${c.tags.map(t=>`<span class="pill prospect">${esc(t)}</span>`).join(' ')}</td></tr>`).join('')}</table>`},
async ord(){const st=window._st||'',rows=await api('/orders?status='+st)
 return `<h1><span class="grad">Orders</span></h1><div class="sub">Real-time order tracking with status history</div><div class="bar">${['','processing','on-hold','completed','cancelled','refunded'].map(s=>`<span class="chip ${s==st?'on':''}" onclick="window._st='${s}';render()">${s||'All'}</span>`).join('')}</div>
 <table><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status timeline</th></tr>${rows.map(o=>`<tr><td><b class="mono">#${o.number}</b><div class="mut" style="font-size:11px">${ago(o.created_at)}</div></td><td><a style="cursor:pointer" onclick="openCust(${o.customer_id})">${esc(o.customer)}</a></td><td class="mut">${o.items.map(i=>esc(i.name)+' ×'+i.quantity).join(', ')}</td><td><b>${money(o.total)}</b></td><td><div class="stepper">${o.history.map((h,i)=>(i?'<i>→</i>':'')+pill(h.status)).join('')}</div></td></tr>`).join('')}</table>`},
async wf(){const rows=await api('/workflows')
 return `<h1><span class="grad">Workflows</span></h1><div class="sub">When a trigger fires and conditions match, the CRM acts — deduplicated per customer & order</div>
 <div class="wfs">${rows.map(w=>`<div class="glass hv"><div style="display:flex;gap:12px;align-items:center"><b style="flex:1">${esc(w.name)}</b><label class="sw"><input type="checkbox" ${w.enabled?'checked':''} onchange="api('/workflows/${w.id}?enabled='+this.checked,{method:'PATCH'}).then(()=>toast('Workflow '+(this.checked?'enabled':'paused')))"><span></span></label></div>
 <div class="flow"><span class="node t">⚡ ${esc(w.trigger)}</span>${Object.keys(w.conditions).length?`<i class="mut">→</i><span class="node cn">if ${esc(Object.entries(w.conditions).map(([k,v])=>k+' '+v).join(', '))}</span>`:''}<i class="mut">→</i><span class="node a">${w.action=='add_tag'?'🏷 tag '+esc(w.tag):'✉️ send email'}</span></div><div class="mut">${esc(w.subject)}</div></div>`).join('')}
 <div class="glass"><b>＋ New workflow</b><div style="display:grid;gap:10px;margin-top:12px"><input id="n" placeholder="Name"><select id="t"><option>customer.created</option><option>order.created</option><option>order.status:completed</option><option>order.status:processing</option><option>order.status:cancelled</option><option>segment.changed</option></select><input id="s" placeholder="Subject — Hi {{first_name}}"><textarea id="b" rows="2" placeholder="Body — {{order_number}} {{order_total}}"></textarea><button class="btn" onclick="addWf()">Create workflow</button></div></div></div>`},
async comm(){const rows=await api('/communications');await badge()
 return `<h1><span class="grad">Messages</span></h1><div class="sub">Everything the CRM sent or drafted. Agent drafts wait for your approval.</div><div class="mail">
 ${rows.map(m=>`<div class="glass hv">${av(m.customer||'?')}<div><b>${esc(m.subject)}</b> ${pill(m.status)}<div class="mut" style="margin:4px 0">To ${esc(m.customer)} · ${m.origin=='agent'?'✦ AI agent':m.origin} · ${ago(m.created_at)}</div><div>${esc(m.body)}</div></div>${m.status=='draft'?`<button class="btn sm" onclick="act('/communications/${m.id}/approve','Email approved & sent ✓')">Approve & send</button>`:''}</div>`).join('')||'<div class="glass mut">No messages yet — simulate an order or run the retention agent.</div>'}</div>`},
async agent(){return `<h1><span class="grad">✦ CRM Agent</span></h1><div class="sub">Claude tool-use agent over live CRM data · drafts only, you stay in control</div>
 <div class="bar">${['Give me an overview','Who are my VIP customers?','Show at risk customers','Draft win-back emails'].map(q=>`<span class="chip" onclick="ask('${q}')">${q}</span>`).join('')}</div>
 <div class="chat" id="chat">${(window._chat||[]).join('')||'<div class="msg bot">Hi! Ask me about segments, VIPs or at-risk customers, or have me draft win-back emails for your approval.</div>'}</div>
 <div class="bar" style="max-width:820px"><input id="msg" style="flex:1" placeholder="Ask about customers, segments, revenue…" onkeydown="if(event.key=='Enter')ask()"><button class="btn" onclick="ask()">Send ➤</button></div>`}}
async function render(keep){const m=$('#main');if(!keep)m.innerHTML='<div class="sk" style="width:40%;height:34px"></div><div class="sk" style="width:60%"></div><div class="sk" style="height:140px"></div>';const f=document.activeElement&&document.activeElement.id=='q';m.innerHTML=await views[view]();document.querySelectorAll('.cu').forEach(countUp);if(f){const q=$('#q');q.focus();q.setSelectionRange(99,99)}api('/stats').then(()=>{$('#src').textContent='WooCommerce'})}
async function act(p,msg,body,cb){const r=await api(p,{method:'POST',body});if(r.detail)return toast(r.detail);msg&&toast(msg);cb&&cb(r);render(1)}
async function ask(q){const i=$('#msg');q=q||(i&&i.value);if(!q)return;window._chat=window._chat||[];window._chat.push(`<div class="msg me">${esc(q)}</div>`);if(view!='agent')nav('agent');else await render(1);$('#chat').insertAdjacentHTML('beforeend','<div class="msg bot typing"><span></span><span></span><span></span></div>')
 const r=await api('/agent/chat',{method:'POST',body:{message:q}});window._chat.push(`<div class="msg bot">${esc(r.reply)}<div>${r.tool_calls.map(t=>`<span class="tc">⚙ ${t.tool}(${esc(JSON.stringify(t.args))})</span>`).join('')}<span class="tc">engine: ${r.engine}</span></div></div>`);render(1)}
async function addWf(){await api('/workflows',{method:'POST',body:{name:$('#n').value||'Untitled',trigger:$('#t').value,subject:$('#s').value,body:$('#b').value}});toast('Workflow created ✓');render(1)}
function closeAll(){$('#panel').classList.remove('open');$('#scrim').classList.remove('open');pal(0)}
async function openCust(id){pal(0);const c=await api('/customers/'+id);$('#panel').classList.add('open');$('#scrim').classList.add('open')
 $('#panel').innerHTML=`<button class="btn gh sm" onclick="closeAll()" style="float:right">✕</button><div style="display:flex;align-items:center;margin-bottom:6px">${av(c.name)}<div><h1 style="font-size:24px">${esc(c.name)}</h1><div class="mut">${esc(c.email)} · ${esc(c.phone)} · ${esc(c.city)}</div></div></div>
 <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0"><div class="glass" style="padding:12px"><div class="mut">Segment</div>${pill(c.segment)}</div><div class="glass" style="padding:12px"><div class="mut">Lifetime value</div><b style="font-size:18px">${money(c.total_spent)}</b></div><div class="glass" style="padding:12px"><div class="mut">RFM</div><b style="font-size:18px">${c.rfm}/15</b></div></div>
 <div class="mut">Tags (comma separated)</div><input id="tg" value="${esc(c.tags.join(', '))}" style="width:100%;margin:6px 0 12px"><div class="mut">Notes</div><textarea id="nt" rows="3" style="width:100%;margin:6px 0 10px">${esc(c.notes)}</textarea><button class="btn" onclick="saveC(${c.id})">Save</button> <button class="btn gh" onclick="ask('Tell me about ${esc(c.name).replace(/'/g,'')}');closeAll()">✦ Ask AI</button>
 <h3>Orders</h3><div class="tl">${c.orders.map(o=>`<div><b class="mono">#${o.number}</b> ${money(o.total)}<div class="stepper" style="margin-top:4px">${o.history.map((h,i)=>(i?'<i>→</i>':'')+pill(h.status)).join('')}</div></div>`).join('')||'<div class="mut">No orders</div>'}</div>
 <h3>Communications</h3><div class="tl">${c.communications.map(m=>`<div><b>${esc(m.subject)}</b> ${pill(m.status)}<div class="mut">${esc(m.body)}</div></div>`).join('')||'<div class="mut">None</div>'}</div>`}
async function saveC(id){await api('/customers/'+id,{method:'PATCH',body:{tags:$('#tg').value.split(','),notes:$('#nt').value}});toast('Saved ✓');render(1)}
// command palette
let P=[],sel=0
const CMDS=[['dash','Go to Dashboard','▣'],['cust','Go to Customers','👥'],['ord','Go to Orders','📦'],['wf','Go to Workflows','⚡'],['comm','Go to Messages','✉️'],['agent','Open AI Agent','✦']]
function pal(o){$('#pal').classList.toggle('open',!!o);$('#scrim').classList.toggle('open',!!o);if(o){$('#pq').value='';palRender();setTimeout(()=>$('#pq').focus(),50)}}
async function palRender(){const q=$('#pq').value.trim();P=CMDS.filter(c=>c[1].toLowerCase().includes(q.toLowerCase())).map(c=>({i:c[2],t:c[1],f:()=>{closeAll();nav(c[0])}}))
 if(q){P.unshift({i:'✦',t:'Ask AI: “'+q+'”',f:()=>{closeAll();ask(q)}});const cs=await api('/customers?q='+encodeURIComponent(q));P.push(...cs.slice(0,5).map(c=>({i:'👤',t:c.name+' — '+c.segment.replace('_',' '),f:()=>openCust(c.id)})))}
 sel=0;drawPal()}
function drawPal(){$('#pres').innerHTML=P.map((p,i)=>`<div class="it ${i==sel?'sel':''}" onclick="P[${i}].f()"><span>${p.i}</span>${esc(p.t)}</div>`).join('')}
function palKey(e){if(e.key=='ArrowDown'){sel=Math.min(sel+1,P.length-1);drawPal();e.preventDefault()}else if(e.key=='ArrowUp'){sel=Math.max(sel-1,0);drawPal();e.preventDefault()}else if(e.key=='Enter'&&P[sel])P[sel].f()}
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='k'){e.preventDefault();pal(1)}if(e.key=='Escape')closeAll()})
render()
</script></body></html>

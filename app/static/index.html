<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WooCRM</title>
<style>
:root{--bg:#0f1419;--panel:#171d25;--panel2:#1e2630;--line:#2a3441;--tx:#e6edf3;--mut:#8b98a8;--ac:#7c5cff;--ac2:#22d3ee;--ok:#34d399;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,Segoe UI,sans-serif;display:flex;min-height:100vh}
nav{width:210px;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;flex-shrink:0}
.logo{font-weight:800;font-size:18px;padding:4px 10px 18px}.logo b{color:var(--ac2)}
nav a{display:block;padding:9px 12px;border-radius:8px;color:var(--mut);cursor:pointer;margin-bottom:2px}nav a:hover{background:var(--panel2);color:var(--tx)}nav a.on{background:var(--ac);color:#fff}
nav .badge{float:right;background:var(--warn);color:#000;border-radius:10px;padding:0 7px;font-size:11px;font-weight:700}
main{flex:1;padding:24px 28px;min-width:0}h1{margin:0 0 4px;font-size:22px}.sub{color:var(--mut);margin-bottom:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.card .k{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em}.card .v{font-size:26px;font-weight:700;margin-top:4px}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mut);font-size:12px;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line)}td{padding:10px;border-bottom:1px solid var(--line)}tr.row:hover{background:var(--panel2);cursor:pointer}
.pill{padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;background:var(--panel2)}
.vip{color:#c4b5fd;background:#7c5cff33}.new{color:var(--ac2);background:#22d3ee22}.active{color:var(--ok);background:#34d39922}.at_risk{color:var(--warn);background:#fbbf2422}.churned{color:var(--bad);background:#f8717122}.prospect{color:var(--mut)}
.completed,.sent{color:var(--ok);background:#34d39922}.processing,.draft{color:var(--warn);background:#fbbf2422}.cancelled,.refunded,.failed{color:var(--bad);background:#f8717122}.on-hold{color:var(--mut)}
button,select,input,textarea{font:inherit;background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
button{cursor:pointer;background:var(--ac);border:0;color:#fff;font-weight:600}button.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--tx)}button:hover{filter:brightness(1.15)}
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}.bar input{flex:1;min-width:180px}
.seg{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:10px 0}.seg i{display:block}
.drawer{position:fixed;right:0;top:0;height:100vh;width:min(520px,100%);background:var(--panel);border-left:1px solid var(--line);padding:22px;overflow:auto;transform:translateX(100%);transition:.25s;z-index:5}.drawer.open{transform:none}
.tl{border-left:2px solid var(--line);margin:8px 0 8px 6px;padding-left:14px}.tl div{margin-bottom:6px;color:var(--mut)}
.chat{display:flex;flex-direction:column;gap:10px;max-width:760px}.msg{padding:10px 14px;border-radius:12px;white-space:pre-wrap}.me{background:var(--ac);align-self:flex-end}.bot{background:var(--panel2);border:1px solid var(--line)}.tool{font-size:12px;color:var(--ac2);font-family:monospace}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ok);color:#000;padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:9}.toast.show{opacity:1}
.mut{color:var(--mut)}.two{display:grid;gap:14px;grid-template-columns:1fr 1fr}@media(max-width:800px){nav{display:none}.two{grid-template-columns:1fr}}
</style></head><body>
<nav><div class="logo">Woo<b>CRM</b></div>
<a data-v="dash" class="on">Dashboard</a><a data-v="cust">Customers</a><a data-v="ord">Orders</a><a data-v="wf">Workflows</a>
<a data-v="comm">Communications <span class="badge" id="draftBadge" hidden></span></a><a data-v="agent">✦ AI Agent</a>
<div class="mut" style="position:absolute;bottom:16px;left:22px;font-size:12px" id="mode"></div></nav>
<main id="main"></main>
<div class="drawer" id="drawer"></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), api=(p,o={})=>fetch('/api'+p,{headers:{'Content-Type':'application/json'},...o,body:o.body&&JSON.stringify(o.body)}).then(r=>r.json())
const money=n=>'₹'+Math.round(n).toLocaleString('en-IN'), pill=s=>`<span class="pill ${s}">${s.replace('_',' ')}</span>`, ago=d=>d?new Date(d).toLocaleDateString():'—'
const COL={vip:'#a78bfa',new:'#22d3ee',active:'#34d399',at_risk:'#fbbf24',churned:'#f87171',prospect:'#475569'}
let view='dash', toastT; const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),2600)}
document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>{document.querySelectorAll('nav a').forEach(x=>x.classList.remove('on'));a.classList.add('on');view=a.dataset.v;render()})
async function badge(){const s=await api('/stats');const b=$('#draftBadge');b.hidden=!s.drafts;b.textContent=s.drafts;return s}
const views={
async dash(){const s=await badge();const tot=s.customers||1
 return `<h1>Dashboard</h1><div class="sub">Live view of your WooCommerce customers, orders and automations</div>
 <div class="bar"><button onclick="act('/sync','Synced from WooCommerce')">⟳ Sync from WooCommerce</button>
 <button class="ghost" onclick="act('/mock/simulate','Webhook delivered: new order',{action:'new_order'})">+ Simulate new order</button>
 <button class="ghost" onclick="act('/mock/simulate','Webhook delivered: order completed',{action:'complete_order'})">✓ Simulate order shipped</button></div>
 <div class="grid">${[['Customers',s.customers],['Orders',s.orders],['Revenue',money(s.revenue)],['Emails sent',s.emails_sent],['Drafts to approve',s.drafts]].map(([k,v])=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}</div>
 <div class="card"><div class="k">Customer segments</div><div class="seg">${Object.entries(s.segments).map(([k,v])=>`<i style="width:${v/tot*100}%;background:${COL[k]}" title="${k}"></i>`).join('')}</div>
 <div style="display:flex;gap:16px;flex-wrap:wrap">${Object.entries(s.segments).map(([k,v])=>`<span><span class="pill ${k}">${k.replace('_',' ')}</span> ${v}</span>`).join('')}</div></div>
 <div class="card" style="margin-top:14px"><div class="k">Orders by status</div><div style="display:flex;gap:16px;margin-top:8px;flex-wrap:wrap">${Object.entries(s.order_status).map(([k,v])=>`<span>${pill(k)} ${v}</span>`).join('')}</div></div>`},
async cust(){const q=window._q||'',sg=window._sg||'';const rows=await api(`/customers?segment=${sg}&q=${encodeURIComponent(q)}`)
 return `<h1>Customers</h1><div class="sub">${rows.length} customers · click a row for the 360° view</div>
 <div class="bar"><input id="q" placeholder="Search name or email…" value="${esc(q)}" oninput="window._q=this.value;clearTimeout(window._t);window._t=setTimeout(render,250)">
 <select onchange="window._sg=this.value;render()"><option value="">All segments</option>${Object.keys(COL).map(s=>`<option ${s==sg?'selected':''} value="${s}">${s.replace('_',' ')}</option>`).join('')}</select></div>
 <div class="card"><table><tr><th>Customer</th><th>Segment</th><th>Orders</th><th>Lifetime value</th><th>RFM</th><th>Last order</th><th>Tags</th></tr>
 ${rows.map(c=>`<tr class="row" onclick="openCust(${c.id})"><td><b>${esc(c.name)}</b><div class="mut">${esc(c.email)}</div></td><td>${pill(c.segment)}</td><td>${c.order_count}</td><td>${money(c.total_spent)}</td><td>${c.rfm||'—'}</td><td>${ago(c.last_order_at)}</td><td>${c.tags.map(t=>`<span class="pill">${esc(t)}</span>`).join(' ')}</td></tr>`).join('')}</table></div>`},
async ord(){const st=window._st||'';const rows=await api('/orders?status='+st)
 return `<h1>Orders</h1><div class="sub">Order tracking with status timeline</div><div class="bar"><select onchange="window._st=this.value;render()"><option value="">All statuses</option>${['processing','on-hold','completed','cancelled','refunded'].map(s=>`<option ${s==st?'selected':''}>${s}</option>`).join('')}</select></div>
 <div class="card"><table><tr><th>#</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Timeline</th></tr>${rows.map(o=>`<tr><td>${o.number}</td><td>${esc(o.customer)}</td><td class="mut">${o.items.map(i=>esc(i.name)+' ×'+i.quantity).join(', ')}</td><td>${money(o.total)}</td><td>${pill(o.status)}</td><td class="mut">${o.history.map(h=>h.status).join(' → ')}</td></tr>`).join('')}</table></div>`},
async wf(){const rows=await api('/workflows')
 return `<h1>Communication workflows</h1><div class="sub">When <b>trigger</b> fires and <b>conditions</b> match → send email / tag. Deduplicated per customer+order.</div>
 <div class="card"><table><tr><th>Name</th><th>Trigger</th><th>Conditions</th><th>Action</th><th>On</th></tr>${rows.map(w=>`<tr><td><b>${esc(w.name)}</b><div class="mut">${esc(w.subject||w.tag)}</div></td><td><code>${w.trigger}</code></td><td class="mut">${esc(JSON.stringify(w.conditions))}</td><td>${w.action}</td><td><input type="checkbox" ${w.enabled?'checked':''} onchange="api('/workflows/${w.id}?enabled='+this.checked,{method:'PATCH'}).then(()=>toast('Updated'))"></td></tr>`).join('')}</table></div>
 <div class="card" style="margin-top:14px"><div class="k">New workflow</div><div class="bar" style="margin-top:8px"><input id="n" placeholder="Name"><select id="t"><option>customer.created</option><option>order.created</option><option>order.status:completed</option><option>order.status:processing</option><option>order.status:cancelled</option><option>segment.changed</option></select></div>
 <div class="bar"><input id="s" placeholder="Subject e.g. Hi {{first_name}}"><input id="b" placeholder="Body, supports {{order_number}} {{order_total}}"><button onclick="addWf()">Add</button></div></div>`},
async comm(){const rows=await api('/communications');await badge()
 return `<h1>Communications</h1><div class="sub">Every message the CRM sent or drafted. Agent drafts need your approval.</div><div class="card"><table><tr><th>To</th><th>Subject</th><th>Origin</th><th>Status</th><th>When</th><th></th></tr>
 ${rows.map(m=>`<tr><td>${esc(m.customer)}</td><td><b>${esc(m.subject)}</b><div class="mut">${esc(m.body)}</div></td><td>${m.origin}</td><td>${pill(m.status)}</td><td class="mut">${ago(m.created_at)}</td><td>${m.status=='draft'?`<button onclick="act('/communications/${m.id}/approve','Email sent')">Approve & send</button>`:''}</td></tr>`).join('')||'<tr><td class="mut">Nothing yet — sync & simulate an order.</td></tr>'}</table></div>`},
async agent(){return `<h1>✦ CRM Agent</h1><div class="sub">Claude tool-use agent over your CRM (offline rule fallback when no API key). Drafts only — you approve.</div>
 <div class="bar"><button onclick="act('/agent/retention-run','',null,r=>toast('Agent drafted '+r.drafts.length+' win-back emails → Communications'))">Run autonomous retention agent</button>
 ${['Give me an overview','Who are my VIP customers?','Show at risk customers','Draft win-back emails'].map(q=>`<button class="ghost" onclick="ask('${q}')">${q}</button>`).join('')}</div>
 <div class="chat" id="chat">${(window._chat||[]).join('')}</div><div class="bar" style="margin-top:14px;max-width:760px"><input id="msg" placeholder="Ask about customers, segments, revenue…" onkeydown="if(event.key=='Enter')ask()"><button onclick="ask()">Send</button></div>`}}
async function render(){$('#main').innerHTML='<div class="mut">Loading…</div>';$('#main').innerHTML=await views[view]();api('/stats').then(()=>{});fetch('/health').then(()=>{$('#mode').textContent='● connected'})}
async function act(p,msg,body,cb){const r=await api(p,{method:'POST',body});if(r.detail)return toast(r.detail);msg&&toast(msg);cb&&cb(r);render()}
async function ask(q){const i=$('#msg');q=q||i.value;if(!q)return;window._chat=[...(window._chat||[]),`<div class="msg me">${esc(q)}</div>`];await render();$('#chat').insertAdjacentHTML('beforeend','<div class="msg bot mut">Thinking…</div>')
 const r=await api('/agent/chat',{method:'POST',body:{message:q}});window._chat.push(`<div class="msg bot">${esc(r.reply)}<div class="tool">${r.tool_calls.map(t=>'⚙ '+t.tool+'('+JSON.stringify(t.args)+')').join('<br>')}<br>engine: ${r.engine}</div></div>`);render()}
async function addWf(){await api('/workflows',{method:'POST',body:{name:$('#n').value||'Untitled',trigger:$('#t').value,subject:$('#s').value,body:$('#b').value}});toast('Workflow created');render()}
async function openCust(id){const c=await api('/customers/'+id),d=$('#drawer');d.classList.add('open')
 d.innerHTML=`<button class="ghost" onclick="$('#drawer').classList.remove('open')" style="float:right">✕</button><h1>${esc(c.name)}</h1><div class="mut">${esc(c.email)} · ${esc(c.phone)} · ${esc(c.city)}</div><p>${pill(c.segment)} · LTV <b>${money(c.total_spent)}</b> · ${c.order_count} orders · RFM ${c.rfm}</p>
 <div class="k mut">Tags</div><input id="tg" value="${esc(c.tags.join(', '))}" style="width:100%"><div class="k mut" style="margin-top:8px">Notes</div><textarea id="nt" rows="3" style="width:100%">${esc(c.notes)}</textarea><button style="margin-top:8px" onclick="saveC(${c.id})">Save</button>
 <h3>Orders</h3><div class="tl">${c.orders.map(o=>`<div><b style="color:var(--tx)">#${o.number}</b> ${pill(o.status)} ${money(o.total)}<br>${o.history.map(h=>h.status).join(' → ')}</div>`).join('')||'<div>No orders</div>'}</div>
 <h3>Communications</h3><div class="tl">${c.communications.map(m=>`<div><b style="color:var(--tx)">${esc(m.subject)}</b> ${pill(m.status)}<br>${esc(m.body)}</div>`).join('')||'<div>None</div>'}</div>`}
async function saveC(id){await api('/customers/'+id,{method:'PATCH',body:{tags:$('#tg').value.split(','),notes:$('#nt').value}});toast('Saved');render()}
render()
</script></body></html>
